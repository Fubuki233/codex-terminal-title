name: Package platform VSIX files

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            target: win32-x64
          - runner: windows-11-arm
            target: win32-arm64
          - runner: ubuntu-latest
            target: linux-x64
          - runner: ubuntu-24.04-arm
            target: linux-arm64
          - runner: macos-13
            target: darwin-x64
          - runner: macos-14
            target: darwin-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npx vsce package --target ${{ matrix.target }} --out codex-terminal-title-${{ matrix.target }}.vsix
      - uses: actions/upload-artifact@v4
        with:
          name: codex-terminal-title-${{ matrix.target }}
          path: codex-terminal-title-${{ matrix.target }}.vsix
