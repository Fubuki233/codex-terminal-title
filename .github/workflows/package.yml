name: Package platform VSIX files

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        target:
          - win32-x64
          - win32-arm64
          - linux-x64
          - linux-arm64
          - darwin-x64
          - darwin-arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run test:proxy
      - run: npm run build
        env:
          VSCODE_TARGET: ${{ matrix.target }}
      - run: npx vsce package --target ${{ matrix.target }} --out codex-terminal-title-${{ matrix.target }}.vsix
      - uses: actions/upload-artifact@v4
        with:
          name: codex-terminal-title-${{ matrix.target }}
          path: codex-terminal-title-${{ matrix.target }}.vsix
